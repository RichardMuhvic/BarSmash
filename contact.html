<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Bar Smash</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo_image">
            <img src="images/shaker_logo_sansfond.png" alt="logo barsmash">
            <div class="logo">Bar Smash</div>
        </div>
        <h1>Recherchez votre cocktail !</h1>
        <nav>
            <a href="index.html" class="contact-button">🏠 Accueil</a>
        </nav>
    </header>

    <main>
        <section class="contact-container">
            <h1>Contactez-nous</h1>
            <p>Une question ?<br> Une suggestion ?<br> Écrivez-nous !</p>

            <form action="php/contact.php" method="POST">
                <label for="name">Nom :</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message :</label>
                <textarea id="message" name="message" required></textarea>

                <!-- Champ Honeypot caché pour bloquer les bots -->
                <input type="text" name="honeypot" style="display: none;">

                <!-- CAPTCHA Google -->
                <div class="g-recaptcha" data-sitekey="VOTRE_SITE_KEY"></div>

                <button type="submit">📩 Envoyer</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2025 Bar Smash. Tous droits réservés.</p>
    </footer>

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</body>
</html>
